<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Prediction 🩺✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to right, #fceabb, #f8b500);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            width: 420px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }

        textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #f8b500;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        button {
            background-color: #f8b500;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #d89d00;
        }

        .result {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Describe your symptoms below:</h2>
        <form method="POST" action="/predict">
            <textarea name="symptom_sentence" rows="5" placeholder="e.g. I’ve been feeling tired, I have a rash and a little fever."></textarea><br>
            <button type="submit">💡 Predict Disease</button>
        </form>
        {% if prediction %}
            <div class="result">
                🩺 {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
